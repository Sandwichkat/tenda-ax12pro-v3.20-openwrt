######## 适用于2g_ipa_5g_epa ######
######## custom for device ########
[HOST_WIFI_NORMAL]

#频偏修正
rf_pll_ppm_correct=0

#版本/特性控制开关集合
#BIT0: 2G动态校准累加延时配置控制，默认值为0（C20产品置1，在lltf做累加）
#BIT1: 5G动态校准累加延时配置控制，默认值为0（C20产品置1，在lltf做累加）
feature_flags=0x3

#常温upc上限值（bit0~15是5g：0~ff，bit15~31是2g:0~1ff)
cali_upc_protect_limit_2g=0x00960096
cali_upc_protect_limit_5g=0x00500050
#温度变化10℃对应增益变化（bit0~15是5g，bit15~31是2g）
cali_temp_change_pow_amend=0x000a000a

#BEACON 2G TX发送通道选择 0-单通道发送 1-双通道轮流发送 2-双通道发送
beacon_2g_tx_policy=0
#BEACON 5G TX发送通道选择 0-单通道发送 1-双通道轮流发送 2-双通道发送
beacon_5g_tx_policy=2

#智能天线配置 0-无效值 1-AX3 2-AX5 3-2T3R 4-ont-3T3R 5-medusa
smartant_board_type=0

#cca阈值定制化配置
delta_cca_ed_high_20th_2g=0
delta_cca_ed_high_20th_5g=-8
delta_cca_ed_high_40th_5g=0
delta_cca_ed_high_80th_5g=0

#edca定制化配置, tcp时判决edca参数的mpdu门限(千分比)
edca_mpdu_th_no_intf_tcp=200
edca_mpdu_th_no_intf_udp=500

#amsdu聚合开关
ap_tx_amsdu=1
ap_rx_amsdu=1

#过温保护
over_temp_pro_enable=1
over_temp_pro_reduce_pwr_enable=1
over_temp_pro_safe_th=110
over_temp_pro_over_th=115
over_temp_pro_pa_off_th=125
junction_temp_diff=4

#时钟
host_input_tcxo_freq=38400000
rts_clk_freq=32768
646m_clk_switch=1

#ofdm最大功率
cali_ofdm_max_pwr=0x00FA00FA

#tpc工作模式：0=默认模式，1=睡眠模式，2=第三模式
tpc_work_mode_default=0

#超远是否加3dB功率开关：0=不加3dB，1=加3dB
far_dist_pow_gain_switch=0

#ack功率穿墙模式降功率开关：0=不降3dB，1=降3dB。高位2g低位5g
